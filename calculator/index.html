<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reactor Monitor | PBCC Tools</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1b; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; }
        .progress-container { width: 100%; height: 30px; background: #222; border-radius: 15px; margin: 20px 0; overflow: hidden; border: 1px solid #444; position: relative; }
        #temp-bar { width: 50%; height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71, #e74c3c); transition: width 0.5s ease; position: absolute; left: 0; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Reactor Monitor</h1>
        <div class="progress-container"><div id="temp-bar"></div></div>
        <h2 id="temp-display">0°C / 8s</h2>

        <div class="control-group">
            <label>Reactor Level (1-4)</label>
            <input type="number" id="power" value="1" min="1" max="4" oninput="calculate()">
        </div>
        <div class="control-group">
            <label>Coolant (0 or 14)</label>
            <input type="number" id="coolant" value="0" step="14" oninput="calculate()">
        </div>
        <div class="control-group">
            <label>Lasers (Number On)</label>
            <input type="number" id="lasers" value="0" oninput="calculate()">
        </div>
        <div class="control-group">
            <label>Fans (Number On)</label>
            <input type="number" id="fans" value="0" oninput="calculate()">
        </div>
    </div>

    <script>
        function calculate() {
            // Extracted values based on your simulation
            let power = parseInt(document.getElementById('power').value) || 1;
            let coolant = parseInt(document.getElementById('coolant').value) || 0;
            let lasers = parseInt(document.getElementById('lasers').value) || 0;
            let fans = parseInt(document.getElementById('fans').value) || 0;

            // Logic:
            // Reactor Power Level 1 = +2, Level 4 = +14 (Scaling seems to be +4 per level)
            let powerImpact = (power * 4) - 2; 
            let laserImpact = lasers * 2; // Assuming 6 lasers = 12, so 2 per laser
            let fanImpact = fans * 0; // Update this if you have the data for fan cooling
            
            let result = powerImpact + laserImpact - coolant - fanImpact;

            // Temperature capping
            let temp = 0; // This is a tracker for current temp, currently simulated per 8s
            
            document.getElementById('temp-display').innerText = result + "°C / 8s";
            
            // Bar visual (Relative scale)
            let percentage = Math.min(Math.max(((result + 20) / 40) * 100, 0), 100);
            document.getElementById('temp-bar').style.width = percentage + '%';
        }
        calculate();
    </script>
</body>
</html>
