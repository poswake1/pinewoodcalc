<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinewood Computer Core Terminal</title>
    <style>
        /* Modern Reset & Font Configuration */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0e5c9e 0%, #1c266a 40%, #5c1b63 100%);
            background-attachment: fixed;
        }
        
        /* Navigation Header Alignment */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
        
        /* Main Body Layout container */
        main {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            flex-grow: 1;
        }
        
        /* Centered Hero Message Setup */
        .hero-title {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        .hero-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            font-weight: 300;
        }
        
        /* Interactive Reversible Calculator Widget */
        .calculator-container {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: 0 auto 50px auto;
        }
        .calculator-container h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .rate-badge {
            display: inline-block;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* Flex wrapper to keep the title and the hour readout inline */
        .label-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hour-readout {
            font-size: 0.8rem;
            color: rgba(0, 255, 102, 0.8);
            font-family: monospace;
            font-weight: 600;
        }
        
        .input-field {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.4);
        }
        
        /* Specific styling for the read-only projection field */
        .input-field.readonly-total {
            background: rgba(0, 255, 102, 0.05);
            border-color: rgba(0, 255, 102, 0.3);
            color: #00ff66;
            font-weight: bold;
        }
        
        /* Subtle divider line to separate sections visually */
        .section-divider {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 25px 0;
        }

        /* Additional styling omitted for brevity */
    </style>
</head>
<body>

    <!-- Header Navigation Grid -->
    <header>
        <div class="logo">PBCC Tools</div>
        <ul class="nav-links">
            <li><a href="../conversion/index.html">Conversion</a></li>
            <li><a href="../weapons/index.html">Weapons Database</a></li>
        </ul>
    </header>

    <!-- Content Workspace -->
    <main>
        <h1 class="hero-title">Core Simulation Tool</h1>
        <p class="hero-subtitle">Perform simulations for Pinewood facilities accurately and efficiently.</p>

        <!-- Calculator Widget -->
        <div class="calculator-container">
            <h2>Core Simulation</h2>
            <div class="rate-badge">Simulation Rate: 1 Unit = 2 Hours</div>

            <div class="input-group">
                <label for="unit-input">Enter Core Units:</label>
                <input type="number" id="unit-input" class="input-field" placeholder="0">
            </div>

            <hr class="section-divider">

            <div class="input-group">
                <label for="time-output">Resulting Time:</label>
                <input type="number" id="time-output" class="input-field readonly-total" placeholder="0" readonly>
            </div>
        </div>
    </main>

    <!-- Calculation Script -->
    <script>
        const unitInput = document.getElementById('unit-input');
        const timeOutput = document.getElementById('time-output');

        unitInput.addEventListener('input', () => {
            const unit = parseFloat(unitInput.value);
            timeOutput.value = !isNaN(unit) ? (unit * 2).toFixed(2) : '';
        });
    </script>
</body>
</html>
